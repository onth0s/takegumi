# Takegumi Data Model Schemas (Single Source of Truth)
# Runtime defaults live in src/constants/canvasDefaults.ts

WProject:
  type: object
  properties:
    id:
      type: string
      description: Unique project identifier
    name:
      type: string
      description: Name of the project
    panels:
      type: array
      items:
        $ref: '#/WPanel'
    grid:
      type: object
      description: Grid snapping & overlay configuration
      properties:
        size:
          type: number
          default: 10
          description: Grid cell size in pixels
        snapEnabled:
          type: boolean
          default: true
          description: Master toggle for snap-to-grid
        showGrid:
          type: boolean
          default: true
          description: Show/hide the grid overlay
    canvasTheme:
      type: string
      enum: [light, dark]
      default: light
      description: >
        "light" -> WProject bg is white, Viewport/WGrid are dark.
        "dark"  -> WProject bg is black, Viewport/WGrid are light.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    disableSyntheticBorder:
      type: boolean
      default: false
      description: Global opt-out from synthetic border rendering across all panels

WPanel:
  type: object
  properties:
    id:
      type: string
      description: Unique panel identifier
    imageUrl:
      type: string
      description: Remote URL, data URI, or local blob reference (`local://<panelId>`)
      nullable: true
    x:
      type: number
      description: Absolute horizontal X-coordinate on the canvas layout
    y:
      type: number
      description: Absolute vertical Y-coordinate on the canvas layout
    width:
      type: number
      description: Width in pixels
    height:
      type: number
      description: Height in pixels
    textGroups:
      type: array
      items:
        $ref: '#/WTextGroup'
    borderEnabled:
      type: boolean
      default: false
      description: Master toggle for the panel border
    borderColor:
      type: string
      default: "#000000"
      description: CSS color value for the panel border
    borderWidth:
      type: number
      default: 4
      description: Border stroke thickness in pixels
    disableSyntheticBorder:
      type: boolean
      default: false
      description: Per-panel opt-out from synthetic border behavior
    zIndex:
      type: number
      description: Stacking layer order of the panel on the canvas
    style:
      type: object
      properties:
        gutter:
          type: number
          description: Spacing between adjacent panels
        borderStyle:
          type: string
          description: Synthetic border style token
        freeX:
          type: boolean
          description: When true, X position is not snapped to grid
        freeY:
          type: boolean
          description: When true, Y position is not snapped to grid
        freeWidth:
          type: boolean
          description: When true, width is not snapped to grid

WTextGroup:
  type: object
  properties:
    id:
      type: string
      description: Unique text group identifier
    x:
      type: number
      description: Absolute horizontal X-coordinate on the project canvas layout
    y:
      type: number
      description: Absolute vertical Y-coordinate on the project canvas layout
    style:
      type: object
      properties:
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: Backdrop layer opacity — text blocks default to 1 independently
        backgroundColor:
          type: string
          description: Backdrop fill color (opacity applied separately via style.opacity)
          default: "#000000"
        width:
          type: number
          default: 200
          description: Custom width in pixels
        freeWidth:
          type: boolean
          description: When true, width is not snapped to grid
        height:
          type: number
          default: 0
          description: Custom height in pixels. 0 means tight/auto-sizing
        freeHeight:
          type: boolean
          description: When true, height is not snapped to grid
        freeX:
          type: boolean
          description: When true, X position is not snapped to grid
        freeY:
          type: boolean
          description: When true, Y position is not snapped to grid
        borderRadius:
          type: number
          default: 8
        borderWidth:
          type: number
          default: 0
        shapeType:
          type: string
          enum: [rect, pill, rounded-rectangle, action-burst]
          default: rect
    tailAnchor:
      type: object
      nullable: true
      properties:
        x:
          type: number
          description: Absolute anchor target X position on the project canvas layout
        y:
          type: number
          description: Absolute anchor target Y position on the project canvas layout
    tailAnchorBlockId:
      type: string
      nullable: true
      description: >
        When set, the tail anchor attaches to this block's perimeter instead of
        the group container's.
    blocks:
      type: array
      items:
        $ref: '#/WTextBlock'
  description: >
    Backdrop width/height are runtime-computed by useWPath (ResizeObserver) and are
    not persisted on the model.

WTextBlock:
  type: object
  properties:
    id:
      type: string
      description: Unique text block identifier
    text:
      type: string
      description: Text content of the dialogue, narrative or SFX element
    style:
      type: object
      properties:
        fontSize:
          type: number
          default: 24
        fontWeight:
          type: string
          default: "700"
        color:
          type: string
          default: "#ffffff"
        fontFamily:
          type: string
        lineHeight:
          type: number
        textAlign:
          type: string
          enum: [left, center, right]
          default: center
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          description: Text opacity (independent of WTextGroup backdrop opacity)
        backgroundColor:
          type: string
          nullable: true
          description: >
            Backdrop fill color. Falsy values (null, "", "transparent") mean no
            backdrop — the block renders as text-only (SFX mode).
        backgroundOpacity:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          description: Opacity of this block's individual backdrop layer
    transition:
      type: object
      description: "@planned Remotion playback transitions — not implemented yet"
      properties:
        in:
          type: object
          properties:
            type:
              type: string
              enum: [fade, slide, scale]
            duration:
              type: number
        out:
          type: object
          properties:
            type:
              type: string
              enum: [fade, slide, scale]
            duration:
              type: number
